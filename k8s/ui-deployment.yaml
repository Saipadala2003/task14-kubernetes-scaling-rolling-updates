apiVersion: apps/v1
kind: Deployment
metadata:
  name: cifar-ui
  namespace: task14
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cifar-ui
  template:
    metadata:
      labels:
        app: cifar-ui
    spec:
      containers:
        - name: cifar-ui
          image: task14-cifar-ui:v1
          imagePullPolicy: Never
          env:
            - name: CIFAR_API_URL
              value: "http://cifar-api:5000"
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 40
            periodSeconds: 20
