apiVersion: apps/v1
kind: Deployment
metadata:
  name: cifar-api
  namespace: task14
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cifar-api
  template:
    metadata:
      labels:
        app: cifar-api
    spec:
      containers:
        - name: cifar-api
          image: task14-cifar-api:v1
          imagePullPolicy: Never
          env:
            - name: APP_VERSION
              value: "v1"
            - name: MODEL_PATH
              value: "/app/cifar10_cnn.pth"
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 45
            periodSeconds: 20
